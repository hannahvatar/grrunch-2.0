name: Sync weekly deals

# Runs scripts/sync_weekly_deals.py automatically instead of relying on it
# being run by hand (Anabelle, 2026-09-17: walking through the weekly
# pipeline -- flyers publish Thursday, get fetched/classified into
# Airtable locally/manually, and THIS script -- Airtable -> Supabase
# curated_deals as 'pending', then recompute every recipe's deal_tags --
# is the one fully server-side, judgment-free step in that chain, safe
# to run on a schedule since her real review already happens afterward,
# in dev-deals.tsx (not gated by Airtable's own approval field any more).
#
# Timing: aimed for Thursday 6pm Pacific, "revise if necessary". Cron is
# always UTC and GitHub Actions has no DST awareness, so this fixed UTC
# time drifts by an hour across the year -- 01:00 UTC Friday is 6pm PDT
# (UTC-7, roughly Mar-Nov) but only 5pm PST (UTC-8, Nov-Mar) the rest of
# the year. Revisit this cron if that hour of drift matters once winter
# hits.
on:
  schedule:
    - cron: '0 1 * * 5'
  # Lets this be triggered by hand from the Actions tab or `gh workflow
  # run`, e.g. to verify a change to this workflow without waiting for
  # Thursday.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No requirements.txt -- sync_weekly_deals.py is stdlib-only
      # (urllib/json/os/re/datetime), so there's nothing to install.
      - name: Run sync_weekly_deals.py
        working-directory: scripts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 sync_weekly_deals.py
